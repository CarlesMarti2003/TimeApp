<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta etiqueta evita que el usuario haga zoom, dando sensación de app nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeApp</title>
    
    <!-- Enlace a los estilos y al manifest -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Etiquetas específicas para que iOS (Safari) la trate como una App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeApp">
    <!-- Más adelante crearemos el logo y lo enlazaremos aquí -->
    <!-- <link rel="apple-touch-icon" href="icono-192.png"> -->
</head>
<body>
    <!-- Cabecera con las estadísticas del usuario (Gamificación) -->
    <header class="app-header">
        <h1>TimeApp</h1>
        <div class="user-stats">
            <span id="user-level" class="level-badge">Nivel 1</span>
            <span id="user-xp" class="xp-text">0 XP</span>
        </div>
        <!-- Barra de progreso para el nivel -->
        <div class="progress-bar">
            <div id="xp-bar" class="progress-fill" style="width: 0%;"></div>
        </div>
    </header>

    <main>
        <!-- VISTA 1: HOGAR (Pantalla principal original) -->
        <div id="home-section">
            <section class="calendar-section">
                <!-- (Deja aquí dentro el código del calendario que ya tenías) -->
                <div class="calendar-header">
                    <button id="prev-month" class="cal-nav">&lt;</button>
                    <h2 id="month-year-display">Mes Año</h2>
                    <button id="next-month" class="cal-nav">&gt;</button>
                </div>
                <div class="calendar-grid">
                    <div class="day-name">L</div><div class="day-name">M</div><div class="day-name">X</div>
                    <div class="day-name">J</div><div class="day-name">V</div><div class="day-name">S</div><div class="day-name">D</div>
                </div>
                <div id="calendar-days" class="calendar-days"></div>
            </section>

            <section class="events-section">
                <h3>Tareas para hoy</h3>
                <div id="events-list" class="events-list">
                    <!-- Eventos de hoy se cargarán aquí -->
                </div>
            </section>

            <section class="rewards-section">
                <h3>Recompensas Disponibles</h3>
                <div id="rewards-list" class="rewards-list">
                    <!-- Recompensas -->
                </div>
            </section>
        </div>

        <!-- VISTA 2: TAREAS PENDIENTES (Oculta por defecto) -->
        <section id="pending-tasks-section" class="hidden">
            <div class="tasks-header">
                <h2>Todas las tareas</h2>
                <select id="sort-tasks" class="sort-select">
                    <option value="date-asc">Fecha (más próxima)</option>
                    <option value="date-desc">Fecha (más lejana)</option>
                    <option value="xp-desc">XP (Mayor a menor)</option>
                    <option value="xp-asc">XP (Menor a mayor)</option>
                </select>
            </div>
            <div id="all-tasks-list" class="events-list">
                <!-- Todas las tareas irán aquí -->
            </div>
        </section>
    </main>

    <!-- NUEVO: Botón Flotante -->
    <button id="fab-add" class="fab-btn">+</button>

    <!-- Modal modificado con la etiqueta visual para la fecha -->
    <div id="add-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Nueva Tarea</h3>
            <input type="text" id="new-title" placeholder="Ej: Entregar práctica..." class="modal-input">
            
            <label for="new-date" class="modal-label">Fecha del evento</label>
            <input type="date" id="new-date" class="modal-input">
            
            <input type="number" id="new-xp" placeholder="XP a ganar (ej: 50)" class="modal-input">
            <div class="modal-actions">
                <button id="cancel-btn" class="cancel-btn">Cancelar</button>
                <button id="save-btn" class="action-btn">Guardar</button>
            </div>
        </div>
    </div>
    
    <!-- NUEVO: Menú de Navegación Inferior -->
    <nav class="bottom-nav">
        <button id="nav-home" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Hogar</span>
        </button>
        <button id="nav-tasks" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Tareas</span>
        </button>
    </nav>
    <!-- Enlace a la lógica del frontend -->
    <script src="app.js"></script>
</body>
</html>
